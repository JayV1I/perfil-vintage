  <!-- ============ TEXTO ============ -->
  <!-- balão de fala (troca de frases) -->
  <g>
   <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="3.2s" repeatCount="indefinite"/>
   <path class="pap" stroke="#3B2415" stroke-width="5" d="M404 48 Q400 36 418 36 L700 38 Q718 36 716 52 L714 96 Q716 110 698 108 L446 107 L420 124 L426 106 Q404 108 405 94 Z"/>
   <text x="414" y="82" class="ttl ink" font-size="18" letter-spacing="0">
