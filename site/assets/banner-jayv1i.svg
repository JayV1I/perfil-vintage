<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Banner interativo do perfil de João Vitor — assistente de dados e I.A">
<defs>
  <clipPath id="gate"><rect x="8" y="28" width="984" height="264" rx="10"/></clipPath>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C9C6BD"/><stop offset="0.62" stop-color="#AFACA3"/>
    <stop offset="0.63" stop-color="#8E8A82"/><stop offset="1" stop-color="#6E6A63"/>
  </linearGradient>
  <radialGradient id="vig" cx="50%" cy="48%" r="72%">
    <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  <style>
    .ink{fill:#3B2415} .pap{fill:#F3E5C8} .gry{fill:#B39A70}
    .ol{fill:none;stroke:#3B2415;stroke-linecap:round;stroke-linejoin:round}
    .hose{fill:none;stroke:#3B2415;stroke-linecap:round;stroke-linejoin:round}
    .limb{fill:#F3E5C8;stroke:#3B2415;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .ttl{font-family:'Arial Black','Arial Bold',Arial,Helvetica,sans-serif;font-weight:900}
    .sub{font-family:'Arial Black','Arial Bold',Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:5;fill:#3B2415}
  </style>
</defs>

<rect width="1000" height="320" rx="12" fill="#0B0B0B"/>
<g opacity=".9">
<rect x="16" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="16" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="72" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="72" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="128" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="128" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="184" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="184" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="240" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="240" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="296" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="296" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="352" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="352" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="408" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="408" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="464" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="464" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="520" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="520" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="576" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="576" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="632" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="632" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="688" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="688" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="744" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="744" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="800" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="800" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="856" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="856" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="912" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="912" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="968" y="7" width="30" height="15" rx="5" fill="#EFEDE4"/><rect x="968" y="298" width="30" height="15" rx="5" fill="#EFEDE4"/>
</g>

<g clip-path="url(#gate)">
 <g>
