   </text>
   <text x="414" y="82" class="ttl ink" font-size="18" letter-spacing="0" opacity="0">
     <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.33;0.66;1" dur="9s" repeatCount="indefinite"/>
