  </g>

  <text class="ttl" font-size="56" letter-spacing="0" fill="#F3E5C8" stroke="#3B2415" stroke-width="8" paint-order="stroke"><tspan x="404" y="184">J</tspan><tspan x="464" y="184">A</tspan><tspan x="522" y="184">Y</tspan><tspan x="580" y="184">V</tspan><tspan x="640" y="184">I</tspan></text>
  <path fill="none" stroke="#3B2415" stroke-width="7" stroke-linecap="round" d="M406 200 Q470 192 520 201 Q560 208 610 202 Q650 196 694 201"/>
  <text x="408" y="238" class="sub" font-size="16">CI&#202;NCIA DE DADOS &#183; I.A &#183; PUC-CAMPINAS</text>
  <text x="408" y="266" class="sub" font-size="14" opacity=".85">@JayV1I</text>

  <!-- ============ FILME ============ -->
  <rect x="4" y="24" width="992" height="272" fill="url(#vig)"/>
  <rect x="4" y="24" width="992" height="272" filter="url(#grain)" opacity=".22" style="mix-blend-mode:multiply"/>
  <rect x="4" y="24" width="992" height="272" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0.05;0;0.03;0;0.06;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <g stroke="#EFEDE4" stroke-width="1.4" opacity=".3">
    <path d="M300 24 L302 296">
